aid: epic-sciences
name: Epic Sciences
description: >-
  Epic Sciences is a San Diego, California clinical diagnostics company founded in 2008 that
  develops blood-based "liquid biopsy" tests for oncology. Its platform, licensed from the Peter
  Kuhn laboratory at Scripps Research, isolates and characterizes rare circulating tumor cells
  (CTCs) from whole blood using specialized assays and digital pathology algorithms, and is paired
  with circulating tumor DNA (ctDNA) sequencing to inform treatment selection and track how a
  tumor evolves. Its lead product, DefineMBC, is a comprehensive blood biopsy for metastatic
  breast cancer whose 56-gene ctDNA panel received Medicare coverage in April 2023. The company
  also runs its platform as a service for pharmaceutical partners measuring outcomes in clinical
  trials, and in 2020 partnered with Predicine to combine CTC and ctDNA analysis in a single
  offering. Epic Sciences is privately held and has raised roughly $204M across seven rounds
  through a Series G in April 2023. It is a laboratory diagnostics provider, not a software
  vendor, and publishes no public API, developer program, SDK or machine-readable specification.
